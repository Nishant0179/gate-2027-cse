name: Deploy GATE 2027 Platform to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web_platform/package.json'

      - name: Install Dependencies
        working-directory: ./web_platform
        run: npm ci

      - name: Bundle PDF Library into Web Assets
        run: |
          mkdir -p web_platform/public
          for folder in 00_Official_Syllabus 01_Engineering_Mathematics 02_Digital_Logic 03_Computer_Organization 04_Programming_Data_Structures 05_Algorithms 06_Theory_of_Computation 07_Compiler_Design 08_Operating_Systems 09_Databases 10_Computer_Networks 11_General_Aptitude 12_Previous_Year_Questions 13_Practice_Question_Banks 14_Mock_Tests 15_Quick_Revision 16_Study_Plans 17_Final_Revision; do
            if [ -d "$folder" ]; then
              cp -r "$folder" web_platform/public/
            fi
          done

      - name: Build Web Platform
        working-directory: ./web_platform
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web_platform/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
